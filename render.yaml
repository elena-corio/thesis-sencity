# Render blueprint for SenCity (Elena, 2026-11-22). Everything in Frankfurt (EU). Not deployed from here: create the
# blueprint in the Render dashboard (New > Blueprint) when ready, and fill in the values marked "sync: false" there.
# Plans: a persistent disk needs a paid web service (Starter or above); the free Postgres expires, so it is a paid one.
# See README.md, "Deploy on Render".

databases:
  - name: sencity-db
    region: frankfurt
    plan: basic-256mb          # the smallest paid Postgres (the free one expires after 30 days)
    databaseName: sencity
    user: sencity
    ipAllowList: []            # no access from outside Render: only the web service reaches it

services:
  - type: web
    name: sencity
    runtime: python
    region: frankfurt
    plan: starter              # the smallest plan that can have a disk
    branch: main
    autoDeploy: false          # deploy by hand from the dashboard
    buildCommand: >-
      pip install -r backend/requirements.txt &&
      cd frontend && npm ci && npm run build && npm run check:bundle
    startCommand: cd backend && python -m app.db migrate && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    disk:                      # the runs/ caches (areas, general ratings, thermal values): kept across deploys
      name: runs
      mountPath: /opt/render/project/src/runs
      sizeGB: 1                # the smallest disk
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: NODE_VERSION
        value: 24.12.0
      - key: PHOTO_SOURCE      # public builds use Mapillary (decision 2026-11-16); the API refuses Street View on Render
        value: mapillary
      - key: DATABASE_URL
        fromDatabase:
          name: sencity-db
          property: connectionString
      # Secrets: set in the dashboard, never in this file.
      - key: OPENROUTER_API_KEY
        sync: false
      - key: INFRARED_API_KEY
        sync: false
      - key: MAPILLARY_ACCESS_TOKEN
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      # Public, but needed when the frontend is built: the Clerk publishable key.
      - key: VITE_CLERK_PUBLISHABLE_KEY
        sync: false
      # The site's own address, e.g. https://sencity.onrender.com: the only origin a session token is accepted from.
      - key: CLERK_AUTHORIZED_PARTIES
        sync: false
      # Limits (app/limits.py): per user, and the global daily cap on model calls.
      - key: LIMIT_CHAT_PER_HOUR
        value: "30"
      - key: LIMIT_CHAT_PER_DAY
        value: "100"
      - key: LIMIT_RUNS_PER_HOUR
        value: "10"
      - key: LIMIT_RUNS_PER_DAY
        value: "30"
      - key: LIMIT_MODEL_CALLS_PER_DAY
        value: "2000"
