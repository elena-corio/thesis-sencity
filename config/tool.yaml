# SenCity tool configuration. Every threshold used by the scripts lives here.
# Keys never go in this file: they live in .env (see .env.example).

area:
  radius_default_m: 200
  radius_min_m: 50
  radius_max_m: 500          # hard maximum (brief §6)
  radius_step_m: 50
  radius_confirm_above_m: 100  # fetch_photos needs --yes above this (testing phase)
  # Optional allowed area: a GeoJSON Polygon (lon/lat). Empty = any location can be selected.
  allowed_polygon: null
  circle_points: 64

osm:
  overpass_url: https://overpass-api.de/api/interpreter
  buildings_margin_m: 50    # building footprints are fetched this far beyond the circle (indoor test)
  timeout_s: 90
  # Highway values that count as walkable street centrelines or standalone paths.
  walkable_highways: [primary, secondary, tertiary, unclassified, residential,
                      living_street, pedestrian, service, footway, path, steps,
                      track, cycleway, bridleway]
  # Ways matching any of these tag values are dropped from the rated network
  # (kept for the routing graph later, brief §6 "one line per street").
  exclude_tags:
    footway: [sidewalk, crossing]
    service: [driveway, parking_aisle]
    access: [private, "no"]
    foot: ["no"]
    tunnel: ["yes"]
    indoor: ["yes"]
  # highway=footway (no footway=* tag) running alongside a road is treated as a sidewalk:
  # dropped if at least this share of its length lies within this distance of a road centreline.
  alongside_road:
    road_highways: [primary, secondary, tertiary, unclassified, residential, living_street, service]
    distance_m: 12
    min_share: 0.8
  # Courtyards (Elena, 2026-11-01): an unnamed area whose edge runs mostly along buildings is skipped,
  # since courtyards are often private and their photos are often interiors. Named ones are kept.
  courtyard:
    min_enclosed_share: 0.5   # share of the area's edge within building_distance_m of a building
    building_distance_m: 2
  # Areas: parks and squares that intersect the circle, clipped at its edge.
  area_tags:
    leisure: [park]
    place: [square]
    highway: [pedestrian]   # only when the way is closed and area=yes

segments:
  target_length_m: 50       # pieces between intersections are cut into round(L / target) equal parts
  merge_below_m: 10         # a leftover piece shorter than this is merged into its neighbour
  min_isolated_length_m: 1  # only a piece this short with no neighbour (a line grazing the circle) is dropped
  min_area_m2: 50           # smaller clipped park/square slivers are dropped
  # The same square is often mapped twice (place=square and a highway=pedestrian area).
  # An area is dropped when this share of it (or of the other) is covered by an area already kept;
  # parks and squares are kept before pedestrian areas.
  max_area_overlap: 0.8

photo_source: streetview    # streetview | mapillary (only streetview is implemented)

streetview:
  metadata_url: https://maps.googleapis.com/maps/api/streetview/metadata
  image_url: https://maps.googleapis.com/maps/api/streetview
  source: outdoor
  metadata_radius_m: 15     # search radius per sample point
  official_copyright: '^© (\d{4} )?Google$'   # regex; anything else (a person's name) is a contributor photo
  # Streets: when the nearest pano is a contributor photo, retry from nearby points with a smaller radius.
  retry_radius_m: 5
  retry_offsets_m: [-4, 0, 4]   # along the street from the sample point
  # Crop settings, same as the study (640x640, fov 90, pitch 0; confirm against the study).
  size: 640x640
  fov: 90
  pitch: 0
  # Pricing (USD). Metadata calls are free. Check console.cloud.google.com for current prices.
  price_per_1000_images_usd: 7.0
  free_images_per_month: 10000
  request_timeout_s: 20

candidates:
  street_sample_spacing_m: 10   # one metadata call per sample point along a segment
  area_grid_spacing_m: 20       # sample grid inside parks and squares

selection:
  max_photos: 3
  max_age_years: 5              # older photos are dropped when a newer one exists for the segment
  max_distance_to_segment_m: 15 # pano must be this close to the segment line (or inside the area)
  min_spacing_m: 10             # kept photos must be at least this far apart ("different spots")
  indoor_building_inset_m: 1.5  # a photo inside an OSM building footprint (shrunk by this) is "indoor"
  heading_tolerance_deg: 45     # Mapillary only (camera heading vs street direction); unused for Street View

image_check:
  # Run only with --check-images. Images are analysed in memory, never saved.
  grid: 4                       # 4 x 4 tiles
  min_sharp_share: 0.70         # brief: try 0.66-0.75
  tile_min_laplacian_var: 60.0  # tile is "sharp" above this (8-bit greyscale); tune with review notes
  tile_min_std: 12.0            # and not flat (a bus side or plain wall filling the tile)

runs:
  dir: runs/photos

# Thermal comfort (brief §4, §5): Infrared.city thermal-comfort-index (UTCI, "feels like" °C, 1 m
# ground grid), sampled onto the street segments. The 1–5 score and the limits live in the app,
# because personal limits come from the profile, which stays in the browser.
thermal:
  analysis: thermal-comfort-index
  default: {season: summer, time: "15:00"}
  # Each season is one typical day of the weather file, at one hour (a fixed window, brief §5).
  # Hours are the weather file's local standard time: no daylight-saving hour is added.
  seasons:
    spring: {month: 4, day: 15}
    summer: {month: 7, day: 15}
    autumn: {month: 10, day: 15}
    winter: {month: 1, day: 15}
  station_radius_km: 100     # nearest public weather station within this distance
  max_jobs: 4                # refuse a run that would bill more (a 500 m circle is up to 4 tiles)
  optional_input_timeout_s: 20   # trees and ground materials: skipped if not read by then
  buffer_m: 4                # grid cells within this distance either side of a street line
  percentile: 75             # the hotter part, so one unshaded stretch is not averaged away
  cache_dir: runs/thermal    # per area and window: the grid (.npz) and the values per segment (.json)
  rate_per_hour: 10          # new (not cached) thermal runs per IP; each one is billed

# Routes (brief §3): two walking routes between two points, on the rated street lines. Thermal only for
# now (decisions.md, 2026-11-05). A new route is one thermal run on a narrow corridor around its candidates.
routes:
  max_walk_m: 1500           # longest walk asked for, and the shortest way must not be longer
  min_walk_m: 50             # start and end closer than this are not a route
  max_jobs: 8                # thermal tiles per run (10 tokens each); the corridor is narrowed to fit
  length_ratio: 1.25         # B is at most this x the length of A (brief §3)
  walk_m_per_min: 80         # about 4.8 km/h, as the app's walkMetresPerMinute
  # Streets are read from an ellipse around start and end, wide enough for the detours:
  search_ratio: 1.4          # walking distance through the ellipse's edge, x the straight line...
  search_margin_m: 200       # ...plus this
  search_points: 32
  snap_max_m: 100            # a clicked point further than this from any street is refused
  connect_gap_m: 15          # a path's end this close to another street joins it (sidewalks are not mapped in)
  candidates: 8              # tries at finding different ways, each penalising the streets already used
  candidate_penalty: 1.4
  corridor_buffer_m: 40      # streets this close to a candidate get photos and thermal comfort
  thermal_margin_m: 10       # the thermal polygon reaches this far beyond those streets' zone
  easiest_weights: [0.5, 1, 2, 4, 8]  # how much longer a hard street counts when looking for B
  mixed_weight: 0.25         # a mixed or no-value street counts this share of a hard one
  min_difference_share: 0.1  # a "second shortest" B differs from A along at least this share
  cache_dir: runs/routes     # one JSON per start and end: the corridor's segments and photo metadata
  rate_per_hour: 10          # new (not cached) routes per IP

# Backend API (backend/app). The browser only calls this API (brief §10).
api:
  cors_origins: ["http://localhost:5173"]   # the Vite dev server; add the Render site URL when deployed
  search:
    provider_url: https://photon.komoot.io/api/   # Photon (komoot, OpenStreetMap data, no key)
    min_chars: 3
    max_chars: 100
    limit: 5
    timeout_s: 5
    rate_per_minute: 30        # per IP, keeps us within Photon's fair use
    # Naming a point clicked on the map (reverse geocoding, also Photon).
    reverse_url: https://photon.komoot.io/reverse
    reverse_radius_km: 0.1     # a street further than this does not name the point
    reverse_limit: 20          # things inside a park come first, so ask for enough to reach the park itself
    reverse_min_interval_s: 1  # at most one call per second from this server (fair use)
    reverse_cache_size: 1000   # points kept, in memory only
    reverse_rate_per_minute: 30  # per IP
  area:
    cache_dir: runs/areas        # one JSON per area: segments and chosen photo metadata (no images)
    workers: 8                   # segments looked up in parallel (metadata calls are free)
    rate_per_hour: 20            # new (not cached) areas per IP
  photo:
    rate_per_minute: 60          # images per IP; each is a paid Street View call
    browser_cache_s: 3600        # Cache-Control: private, so only the browser keeps it, briefly
  senses:                        # model settings are NOT here: they come only from model/app_v0/
    url: https://openrouter.ai/api/v1/chat/completions
    timeout_s: 60
    cache_file: runs/senses/predictions.json   # JSON output, model ID, latency and cost per photo (no images)
    max_image_bytes: 5000000     # a larger upload is refused
    rate_per_minute: 20          # new (not cached) predictions per IP
